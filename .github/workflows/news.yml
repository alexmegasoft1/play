# نسخة احتياطية مجانية من الأخبار لشاشة ميجا (تُستخدم فقط للمصادر التي لا تصل إليها الشاشة)
name: news
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: true
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "تحديث الأخبار" && git push)
