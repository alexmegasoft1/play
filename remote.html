<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ريموت ميجا">
<title>ريموت ميجا</title>
<!-- ريموت الشاشة: صفحة ثابتة مجانية؛ الأوامر تذهب للشاشة عبر قناة فورية موقّعة بمفتاحها، دون المرور بسيرفر لوحة التحكم -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation}
body{font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif;background:#0B1020;color:#fff;display:flex;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#F2B544}
.logo i{width:36px;height:36px;border-radius:11px;background:#F2B544;color:#0B1020;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px}
.st{font-size:13px;padding:6px 12px;border-radius:20px;background:#1F2A44;color:#94A3B8}
.st.on{background:#12301F;color:#86EFAC}
.row{display:grid;gap:10px}
.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}.r2{grid-template-columns:1fr 1fr}
.b{border:0;border-radius:18px;background:#1A2547;color:#fff;font-family:inherit;font-size:17px;font-weight:800;height:58px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .08s,background .15s}
.b:active,.b.hit{transform:scale(.94);background:#2A3A6B}
.b small{font-size:12px;color:#94A3B8;font-weight:600}
.pad{position:relative;width:min(84vw,330px);height:min(84vw,330px);margin:4px auto;border-radius:50%;background:#141C36;border:1px solid #26335C}
.pad .b{position:absolute;width:31%;height:31%;border-radius:50%;font-size:28px;background:transparent}
.pad .b:active,.pad .b.hit{background:#22305A}
.pad .u{top:2%;left:34.5%}.pad .d{bottom:2%;left:34.5%}.pad .l{left:2%;top:34.5%}.pad .r{right:2%;top:34.5%}
.pad .ok{left:29%;top:29%;width:42%;height:42%;background:#F2B544;color:#0B1020;font-size:22px}
.pad .ok:active,.pad .ok.hit{background:#E0A32E}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;height:52px;border-radius:16px;border:1px solid #26335C;background:#141C36;color:#fff;font-family:inherit;font-size:17px;padding:0 14px;user-select:text;-webkit-user-select:text}
.type .b{height:52px;padding:0 16px}
.card{background:#3A1D1D;border:1px solid #7F1D1D;border-radius:20px;padding:18px;line-height:1.8;font-size:16px}
.hint{font-size:12.5px;color:#7C89AB;text-align:center;line-height:1.7}
.hide{display:none!important}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <div class="logo"><i>📺</i> ريموت ميجا</div>
    <span id="st" class="st">جارٍ الاتصال…</span>
  </div>

  <div id="nokey" class="card hide">
    هذا الريموت يحتاج مفتاح شاشتك. افتحه من لوحة التحكم: «الريموت» ← «ريموت الموبايل السريع»، أو امسح الرمز الظاهر هناك.
  </div>

  <div id="ui">
    <div class="row r4">
      <button class="b" data-k="home">🏠<small>الرئيسية</small></button>
      <button class="b" data-k="back">↩<small>رجوع</small></button>
      <button class="b" data-k="recents">🗂<small>التطبيقات</small></button>
      <button class="b" data-k="mute">🔇</button>
    </div>

    <div class="pad" dir="ltr">
      <button class="b u" data-k="up" data-rep="1">▲</button>
      <button class="b l" data-k="left" data-rep="1">◀</button>
      <button class="b ok" data-k="ok">موافق</button>
      <button class="b r" data-k="right" data-rep="1">▶</button>
      <button class="b d" data-k="down" data-rep="1">▼</button>
    </div>

    <div class="row r3" dir="ltr">
      <button class="b" data-k="prev">⏮</button>
      <button class="b" data-k="play_pause">⏯</button>
      <button class="b" data-k="next">⏭</button>
    </div>
    <div class="row r2" style="margin-top:10px">
      <button class="b" data-k="vol_up" data-rep="1">🔊 +</button>
      <button class="b" data-k="vol_down" data-rep="1">🔉 −</button>
    </div>

    <form id="tf" class="type" style="margin-top:14px">
      <input id="tx" placeholder="اكتب نصًا يظهر على الشاشة" autocomplete="off" enterkeyhint="send">
      <button class="b" type="submit">إرسال</button>
      <button class="b" type="button" id="bk" aria-label="حذف حرف">⌫</button>
    </form>
    <p class="hint">أضف هذه الصفحة إلى الشاشة الرئيسية لتفتحها كتطبيق.<br>الأوامر تذهب للشاشة مباشرة عبر قناة فورية موقّعة بمفتاحها.</p>
  </div>
</div>

<script src="megart.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var m = /(?:^|[#&?])k=([0-9a-f]{32})/.exec(location.hash + '&' + location.search);
  var key = m ? m[1] : '';
  try {
    if (key) localStorage.setItem('mega_rk', key); else key = localStorage.getItem('mega_rk') || '';
  } catch (e) {}
  if (!/^[0-9a-f]{32}$/.test(key)) { $('ui').classList.add('hide'); $('nokey').classList.remove('hide'); $('st').classList.add('hide'); return; }

  var st = $('st');
  var rt = new window.MegaRT(key, {
    onstate: function (up) {
      st.textContent = up ? '⚡ متصل' : 'جارٍ الاتصال…';
      st.classList.toggle('on', up);
    }
  });

  function send(c, p) {
    if (navigator.vibrate) navigator.vibrate(10);
    rt.send(c, p);
  }

  // الضغط المطوّل على الأسهم والصوت يكرر الأمر
  document.querySelectorAll('[data-k]').forEach(function (b) {
    var k = b.getAttribute('data-k'), rep = b.hasAttribute('data-rep'), t1 = null, t2 = null;
    function stop() { clearTimeout(t1); clearInterval(t2); b.classList.remove('hit'); }
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      b.classList.add('hit');
      send('key', { key: k });
      if (rep) t1 = setTimeout(function () { t2 = setInterval(function () { send('key', { key: k }); }, 140); }, 420);
    });
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointerleave', stop);
    b.addEventListener('pointercancel', stop);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  $('tf').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = $('tx').value;
    if (!t) { send('key', { key: 'ok' }); return; }
    send('type', { text: t });
    $('tx').value = '';
  });
  $('bk').addEventListener('click', function () { send('type', { text: '', backspace: true }); });

  // العودة للصفحة بعد غياب: إعادة الاتصال فورًا
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !rt.up && rt.ws) { try { rt.ws.close(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
